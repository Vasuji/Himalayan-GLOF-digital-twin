[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "himalaya-glof-twin"
version = "0.2.0"
description = "End-to-end AI digital twin for Himalayan glacial lake outburst floods (Earth-2 + PhysicsNeMo)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

# Toy tier: everything needed to run the full end-to-end pipeline on a CPU laptop.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "torch>=2.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Production tier: NVIDIA stack. Install on a CUDA machine.
# physicsnemo is published on PyPI as `nvidia-physicsnemo` and imported as `physicsnemo`.
nvidia = [
    "nvidia-physicsnemo>=2.2.1",
    "earth2studio>=0.18.0",
]
# PhysicsNeMo GNNs now use PyTorch Geometric; DGL support is deprecated upstream.
graph = [
    "torch-geometric>=2.6",
    "torch-scatter>=2.1",
    "torch-cluster>=1.6",
]
io = [
    "xarray>=2024.1",
    "zarr>=2.18",
    "netCDF4>=1.6",
    "rasterio>=1.3",
]
viz = [
    "usd-core>=24.05",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
glof = "glof_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["glof_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow and not gpu'"
markers = [
    "slow: end-to-end runs (minutes on CPU)",
    "gpu: requires a CUDA host (surrogate training, Earth-2 model packages)",
    "torch: requires PyTorch",
    "nvidia: requires physicsnemo or earth2studio",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
